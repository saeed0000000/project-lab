version: 1
targets:
  # Non-sensitive ConfigMap drift test.
  - kind: ConfigMap
    namespace: default
    name: drift-lab
    manifest: k8s/drift-lab.yaml
    fields:
      - data.mode

  # Isolated Deployment replicas drift test.
  - kind: Deployment
    namespace: default
    name: replicas-lab
    manifest: k8s/replicas-lab.yaml
    fields:
      - spec.replicas
