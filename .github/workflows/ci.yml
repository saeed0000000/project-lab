name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - 'argocd/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'

  push:
    branches:
      - '**'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - 'argocd/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - 'README.md'
      - 'docs/**'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install drift watcher test dependency
        run: python -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.3"

      - name: Run drift watcher unit tests
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build Docker images
        run: |
          set -euo pipefail

          docker build \
            --tag "finance-api:${GITHUB_SHA}" \
            ./backend

          docker build \
            --tag "finance-web:${GITHUB_SHA}" \
            ./frontend

      - name: Prepare SBOM output directory
        run: mkdir -p sbom

      - name: Generate backend image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: finance-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom/finance-api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate frontend image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: finance-web:${{ github.sha }}
          format: spdx-json
          output-file: sbom/finance-web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload container SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-sboms-${{ github.sha }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-web:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Verify Kubernetes image digests
        run: |
          set -euo pipefail
          test -f .github/scripts/verify-image-digests.sh
          bash .github/scripts/verify-image-digests.sh
