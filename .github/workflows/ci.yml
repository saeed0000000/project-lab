name: CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - 'argocd/**'
      - 'scripts/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '**/*.yaml'
      - '**/*.yml'

  push:
    branches:
      - '**'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - 'argocd/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '**/*.yaml'
      - '**/*.yml'
      - 'README.md'
      - 'docs/**'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref == github.event.repository.default_branch }}
    name: Build and Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build Docker images
        run: |
          set -euo pipefail

          docker build \
            --tag "finance-api:${GITHUB_SHA}" \
            ./backend

          docker build \
            --tag "finance-web:${GITHUB_SHA}" \
            ./frontend

      - name: Prepare SBOM output directory
        run: mkdir -p sbom

      - name: Generate backend image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: finance-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom/finance-api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate frontend image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: finance-web:${{ github.sha }}
          format: spdx-json
          output-file: sbom/finance-web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload container SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-sboms-${{ github.sha }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-web:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Verify Kubernetes image digests
        env:
          API_MANIFEST: ${{ vars.RELEASE_API_MANIFEST || 'k8s/backend.yaml' }}
          WEB_MANIFEST: ${{ vars.RELEASE_WEB_MANIFEST || 'k8s/frontend.yaml' }}
        run: |
          set -euo pipefail
          test -f .github/scripts/verify-image-digests.sh

          # Preserve validation of all existing k8s/ manifests.
          bash .github/scripts/verify-image-digests.sh

          # Also validate the manifests selected for the release workflow.
          bash .github/scripts/verify-image-digests.sh             "$API_MANIFEST"             "$WEB_MANIFEST"
