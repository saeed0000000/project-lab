name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, Scan, Publish and Propose GitOps Update
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      VERSION: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Optional repository variables; defaults preserve project-lab's current layout.
      API_CONTEXT: ${{ vars.RELEASE_API_CONTEXT || 'backend' }}
      WEB_CONTEXT: ${{ vars.RELEASE_WEB_CONTEXT || 'frontend' }}
      API_DOCKERFILE: ${{ vars.RELEASE_API_DOCKERFILE || 'backend/Dockerfile' }}
      WEB_DOCKERFILE: ${{ vars.RELEASE_WEB_DOCKERFILE || 'frontend/Dockerfile' }}
      API_MANIFEST: ${{ vars.RELEASE_API_MANIFEST || 'k8s/backend.yaml' }}
      WEB_MANIFEST: ${{ vars.RELEASE_WEB_MANIFEST || 'k8s/frontend.yaml' }}
      API_IMAGE_REPOSITORY: ${{ vars.RELEASE_API_IMAGE_REPOSITORY }}
      WEB_IMAGE_REPOSITORY: ${{ vars.RELEASE_WEB_IMAGE_REPOSITORY }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare repository-specific image names
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_name="${repo_name,,}"

          api_image="${API_IMAGE_REPOSITORY:-ghcr.io/${owner}/${repo_name}-api}"
          web_image="${WEB_IMAGE_REPOSITORY:-ghcr.io/${owner}/${repo_name}-web}"

          for image in "$api_image" "$web_image"; do
            if [[ ! "$image" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*$ || "$image" == */ || "$image" == *//* ]]; then
              echo "::error::Invalid GHCR image repository: $image"
              echo "Use a lowercase ghcr.io/owner/image path without a tag or digest."
              exit 1
            fi
          done

          echo "API_IMAGE=$api_image" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$web_image" >> "$GITHUB_ENV"
          echo "Using default branch: ${DEFAULT_BRANCH}"
          echo "Backend context: ${API_CONTEXT}; manifest: ${API_MANIFEST}"
          echo "Frontend context: ${WEB_CONTEXT}; manifest: ${WEB_MANIFEST}"

      - name: Validate release tag and source branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "ERROR: Invalid release tag: $VERSION"
            echo "Expected format: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease (e.g. v1.0.8-rc.1)"
            exit 1
          fi

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          unset AUTH_HEADER

          TAG_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "ERROR: Release tags must point to a commit contained in ${DEFAULT_BRANCH}."
            echo "Tag commit: $TAG_COMMIT"
            exit 1
          fi

          echo "Validated release $VERSION from commit $TAG_COMMIT on ${DEFAULT_BRANCH}."

      - name: Validate configurable release paths
        shell: bash
        run: |
          set -euo pipefail

          [[ -d "$API_CONTEXT" ]] || { echo "::error::Backend build context not found: $API_CONTEXT"; exit 1; }
          [[ -d "$WEB_CONTEXT" ]] || { echo "::error::Frontend build context not found: $WEB_CONTEXT"; exit 1; }
          [[ -f "$API_DOCKERFILE" ]] || { echo "::error::Backend Dockerfile not found: $API_DOCKERFILE"; exit 1; }
          [[ -f "$WEB_DOCKERFILE" ]] || { echo "::error::Frontend Dockerfile not found: $WEB_DOCKERFILE"; exit 1; }
          [[ -f "$API_MANIFEST" ]] || { echo "::error::Backend manifest not found: $API_MANIFEST"; exit 1; }
          [[ -f "$WEB_MANIFEST" ]] || { echo "::error::Frontend manifest not found: $WEB_MANIFEST"; exit 1; }
          [[ "$API_MANIFEST" != "$WEB_MANIFEST" ]] || {
            echo "::error::Backend and frontend manifests must be different files."
            exit 1
          }

          [[ "$(grep -Ec '^[[:space:]]*image:[[:space:]]*' "$API_MANIFEST")" -eq 1 ]] || {
            echo "::error::Expected exactly one image line in $API_MANIFEST"
            exit 1
          }
          [[ "$(grep -Ec '^[[:space:]]*image:[[:space:]]*' "$WEB_MANIFEST")" -eq 1 ]] || {
            echo "::error::Expected exactly one image line in $WEB_MANIFEST"
            exit 1
          }

          test -f .github/scripts/verify-image-digests.sh || {
            echo "::error::Missing .github/scripts/verify-image-digests.sh security validation script."
            exit 1
          }

      - name: Validate GitHub App configuration
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" ]]; then
            echo "::error::Missing repository/org variable APP_CLIENT_ID. Configure it for this repository."
            exit 1
          fi
          if [[ -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Missing repository/org secret APP_PRIVATE_KEY. Configure it for this repository."
            exit 1
          fi

      - name: Create GitHub App token for CI-triggering pull request
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        run: |
          set -euo pipefail
          docker build --file "$API_DOCKERFILE" --tag "${API_IMAGE}:${VERSION}" "$API_CONTEXT"

      - name: Build frontend image
        run: |
          set -euo pipefail
          docker build --file "$WEB_DOCKERFILE" --tag "${WEB_IMAGE}:${VERSION}" "$WEB_CONTEXT"

      - name: Prepare SBOM output directory
        run: mkdir -p sbom

      - name: Generate backend image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.API_IMAGE }}:${{ env.VERSION }}
          format: spdx-json
          output-file: sbom/api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate frontend image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.WEB_IMAGE }}:${{ env.VERSION }}
          format: spdx-json
          output-file: sbom/web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sboms-${{ env.VERSION }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Scan backend image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ env.VERSION }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan frontend image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ env.VERSION }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned images
        run: |
          set -euo pipefail
          docker push "${API_IMAGE}:${VERSION}"
          docker push "${WEB_IMAGE}:${VERSION}"

      - name: Resolve and validate image digests
        id: digest
        shell: bash
        run: |
          set -euo pipefail

          API_DIGEST="$(docker buildx imagetools inspect "${API_IMAGE}:${VERSION}" | awk '$1 == "Digest:" {print $2; exit}')"
          WEB_DIGEST="$(docker buildx imagetools inspect "${WEB_IMAGE}:${VERSION}" | awk '$1 == "Digest:" {print $2; exit}')"

          [[ "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "ERROR: Invalid backend image digest: $API_DIGEST"
            exit 1
          }
          [[ "$WEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "ERROR: Invalid frontend image digest: $WEB_DIGEST"
            exit 1
          }

          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_digest=$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Backend image:  ${API_IMAGE}:${VERSION}@${API_DIGEST}"
          echo "Frontend image: ${WEB_IMAGE}:${VERSION}@${WEB_DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign and verify backend image
        env:
          IMAGE: ${{ env.API_IMAGE }}
          DIGEST: ${{ steps.digest.outputs.api_digest }}
          VERSION: ${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE}@${DIGEST}"

          cosign sign --yes "$IMAGE_REF"

          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REF"

      - name: Sign and verify frontend image
        env:
          IMAGE: ${{ env.WEB_IMAGE }}
          DIGEST: ${{ steps.digest.outputs.web_digest }}
          VERSION: ${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE}@${DIGEST}"

          cosign sign --yes "$IMAGE_REF"

          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REF"

      - name: Attest backend image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest frontend image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.web_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify backend image provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.API_IMAGE }}
          DIGEST: ${{ steps.digest.outputs.api_digest }}
          VERSION: ${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/${VERSION}"

      - name: Verify frontend image provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.WEB_IMAGE }}
          DIGEST: ${{ steps.digest.outputs.web_digest }}
          VERSION: ${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/${VERSION}"

      - name: Check out current default branch for GitOps update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          unset AUTH_HEADER
          git checkout -B "$DEFAULT_BRANCH" "refs/remotes/origin/${DEFAULT_BRANCH}"
      - name: Update Kubernetes image references
        env:
          API_DIGEST: ${{ steps.digest.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.digest.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "ERROR: Invalid backend digest"; exit 1; }
          [[ "$WEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "ERROR: Invalid frontend digest"; exit 1; }

          [[ "$(grep -Ec '^[[:space:]]*image:[[:space:]]*' "$API_MANIFEST")" -eq 1 ]] || {
            echo "ERROR: Expected exactly one image line in $API_MANIFEST"
            exit 1
          }
          [[ "$(grep -Ec '^[[:space:]]*image:[[:space:]]*' "$WEB_MANIFEST")" -eq 1 ]] || {
            echo "ERROR: Expected exactly one image line in $WEB_MANIFEST"
            exit 1
          }

          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*).*$|\1${API_IMAGE}:${VERSION}@${API_DIGEST}|" \
            "$API_MANIFEST"
          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*).*$|\1${WEB_IMAGE}:${VERSION}@${WEB_DIGEST}|" \
            "$WEB_MANIFEST"

          grep -F "image: ${API_IMAGE}:${VERSION}@${API_DIGEST}" "$API_MANIFEST"
          grep -F "image: ${WEB_IMAGE}:${VERSION}@${WEB_DIGEST}" "$WEB_MANIFEST"

          git diff --check
          bash .github/scripts/verify-image-digests.sh "$API_MANIFEST" "$WEB_MANIFEST"

          echo "=== Proposed GitOps diff ==="
          git --no-pager diff -- "$API_MANIFEST" "$WEB_MANIFEST"

      - name: Open GitOps pull request
        id: gitops-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/deploy-${{ env.VERSION }}
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          add-paths: |
            ${{ env.API_MANIFEST }}
            ${{ env.WEB_MANIFEST }}
          commit-message: "release: propose deployment of ${{ env.VERSION }}"
          title: "deploy: ${{ env.VERSION }}"
          body: |
            ## GitOps deployment proposal

            This pull request updates the application image references to the immutable digests built from release tag `${{ env.VERSION }}`.

            - Backend: `${{ env.API_IMAGE }}:${{ env.VERSION }}@${{ steps.digest.outputs.api_digest }}`
            - Frontend: `${{ env.WEB_IMAGE }}:${{ env.VERSION }}@${{ steps.digest.outputs.web_digest }}`

            Please review the manifest diff and required CI checks before merging. Argo CD tracks `${{ github.event.repository.default_branch }}`, so the deployment becomes desired state only after this pull request is merged.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          files: |
            sbom/api.spdx.json
            sbom/web.spdx.json
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          make_latest: ${{ !contains(env.VERSION, '-') }}
