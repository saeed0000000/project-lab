
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, Scan, Publish and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      VERSION: ${{ github.ref_name }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/finance-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/finance-web

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release tag: $VERSION"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "Release version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          set -euo pipefail

          docker build \
            --tag "${API_IMAGE}:${VERSION}" \
            ./backend

      - name: Build frontend image
        run: |
          set -euo pipefail

          docker build \
            --tag "${WEB_IMAGE}:${VERSION}" \
            ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/finance-api:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/finance-web:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        run: |
          set -euo pipefail

          docker push "${API_IMAGE}:${VERSION}"
          docker push "${WEB_IMAGE}:${VERSION}"

      - name: Resolve and validate image digests
        id: digest
        run: |
          set -euo pipefail

          API_DIGEST="$(
            docker buildx imagetools inspect "${API_IMAGE}:${VERSION}" |
              awk '$1 == "Digest:" {print $2; exit}'
          )"

          WEB_DIGEST="$(
            docker buildx imagetools inspect "${WEB_IMAGE}:${VERSION}" |
              awk '$1 == "Digest:" {print $2; exit}'
          )"

          if [[ ! "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid backend image digest: $API_DIGEST"
            exit 1
          fi

          if [[ ! "$WEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid frontend image digest: $WEB_DIGEST"
            exit 1
          fi

          echo "Backend digest:  $API_DIGEST"
          echo "Frontend digest: $WEB_DIGEST"

          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_digest=$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Checkout latest main for GitOps update
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          git checkout -B release-manifest-update origin/main

      - name: Update Kubernetes image references
        env:
          API_DIGEST: ${{ steps.digest.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.digest.outputs.web_digest }}
        run: |
          set -euo pipefail

          # Ensure each manifest contains exactly one application image.
          [[ "$(grep -Ec '^[[:space:]]*image:[[:space:]]*' k8s/backend.yaml)" -eq 1 ]]
          [[ "$(grep -Ec '^[[:space:]]*image:[[:space:]]*' k8s/frontend.yaml)" -eq 1 ]]

          # Update only the intended image repository.
          grep -Eq "^[[:space:]]*image:[[:space:]]*${API_IMAGE}([:@]|$)" k8s/backend.yaml
          grep -Eq "^[[:space:]]*image:[[:space:]]*${WEB_IMAGE}([:@]|$)" k8s/frontend.yaml

          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*)${API_IMAGE}.*$|\1${API_IMAGE}:${VERSION}@${API_DIGEST}|" \
            k8s/backend.yaml

          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*)${WEB_IMAGE}.*$|\1${WEB_IMAGE}:${VERSION}@${WEB_DIGEST}|" \
            k8s/frontend.yaml

          # Verify the final references exactly.
          grep -F "image: ${API_IMAGE}:${VERSION}@${API_DIGEST}" k8s/backend.yaml
          grep -F "image: ${WEB_IMAGE}:${VERSION}@${WEB_DIGEST}" k8s/frontend.yaml

          git diff --check

      - name: Validate all Kubernetes image digests
        run: |
          set -euo pipefail

          if [[ ! -f .github/scripts/verify-image-digests.sh ]]; then
            echo "ERROR: Image digest verification script is missing."
            exit 1
          fi

          bash .github/scripts/verify-image-digests.sh

      - name: Show GitOps changes
        run: |
          set -euo pipefail
          git --no-pager diff -- k8s/backend.yaml k8s/frontend.yaml

      - name: Commit and push GitOps update
        run: |
          set -euo pipefail

          if git diff --quiet -- k8s/backend.yaml k8s/frontend.yaml; then
            echo "ERROR: No Kubernetes manifest changes detected."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend.yaml k8s/frontend.yaml
          git commit -m "release: deploy ${VERSION}"

          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
