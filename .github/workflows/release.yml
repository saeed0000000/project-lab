
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, Scan, Publish and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      VERSION: ${{ github.ref_name }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/finance-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/finance-web

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release tag: $VERSION"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "Release version: $VERSION"



      - name: Detect target branch from release tag
        id: target-branch
        shell: bash
        run: |
          set -euo pipefail

          # Fetch all remote branches so the tag commit can be located.
          git fetch --prune origin \
            '+refs/heads/*:refs/remotes/origin/*'

          TAG_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"

          # Find branches whose history contains the tagged commit.
          mapfile -t MATCHING_BRANCHES < <(
            while IFS= read -r remote_ref; do
              [[ "$remote_ref" == "origin/HEAD" ]] && continue

              if git merge-base --is-ancestor \
                "$TAG_COMMIT" "$remote_ref"; then
                printf '%s\n' "${remote_ref#origin/}"
              fi
            done < <(
              git for-each-ref \
                --format='%(refname:short)' \
                refs/remotes/origin
            )
          )

          # Never guess if the tag belongs to multiple branches.
          if [[ "${#MATCHING_BRANCHES[@]}" -ne 1 ]]; then
            echo "ERROR: Cannot uniquely identify the source branch."
            echo "Tag commit: $TAG_COMMIT"
            echo "Matching branches:"
            printf '  %s\n' "${MATCHING_BRANCHES[@]}"
            echo "Tag a commit belonging to exactly one branch, or choose the target explicitly."
            exit 1
          fi

          TARGET_BRANCH="${MATCHING_BRANCHES[0]}"

          echo "Detected branch: $TARGET_BRANCH"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"




      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          set -euo pipefail

          docker build \
            --tag "${API_IMAGE}:${VERSION}" \
            ./backend

      - name: Build frontend image
        run: |
          set -euo pipefail

          docker build \
            --tag "${WEB_IMAGE}:${VERSION}" \
            ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/finance-api:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/finance-web:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        run: |
          set -euo pipefail

          docker push "${API_IMAGE}:${VERSION}"
          docker push "${WEB_IMAGE}:${VERSION}"

      - name: Resolve and validate image digests
        id: digest
        run: |
          set -euo pipefail

          API_DIGEST="$(
            docker buildx imagetools inspect "${API_IMAGE}:${VERSION}" |
              awk '$1 == "Digest:" {print $2; exit}'
          )"

          WEB_DIGEST="$(
            docker buildx imagetools inspect "${WEB_IMAGE}:${VERSION}" |
              awk '$1 == "Digest:" {print $2; exit}'
          )"

          if [[ ! "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid backend image digest: $API_DIGEST"
            exit 1
          fi

          if [[ ! "$WEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid frontend image digest: $WEB_DIGEST"
            exit 1
          fi

          echo "Backend digest:  $API_DIGEST"
          echo "Frontend digest: $WEB_DIGEST"

          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_digest=$WEB_DIGEST" >> "$GITHUB_OUTPUT"



      - name: Checkout detected branch for GitOps update
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$TARGET_BRANCH"
          git checkout -B release-manifest-update "origin/$TARGET_BRANCH"


      - name: Update Kubernetes image references
        env:
          API_DIGEST: ${{ steps.digest.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.digest.outputs.web_digest }}
        run: |
          set -euo pipefail

          # Validate the image digests before updating manifests.
          [[ "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "ERROR: Invalid backend image digest"
            exit 1
          }

          [[ "$WEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "ERROR: Invalid frontend image digest"
            exit 1
          }

          # Ensure each manifest contains exactly one application image.
          [[ "$(grep -Ec '^[[:space:]]*image:[[:space:]]*' k8s/backend.yaml)" -eq 1 ]] || {
            echo "ERROR: Expected exactly one image line in k8s/backend.yaml"
            exit 1
          }

          [[ "$(grep -Ec '^[[:space:]]*image:[[:space:]]*' k8s/frontend.yaml)" -eq 1 ]] || {
            echo "ERROR: Expected exactly one image line in k8s/frontend.yaml"
            exit 1
          }

          # Replace the entire image line regardless of its previous value.
          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*).*$|\1${API_IMAGE}:${VERSION}@${API_DIGEST}|" \
            k8s/backend.yaml

          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*).*$|\1${WEB_IMAGE}:${VERSION}@${WEB_DIGEST}|" \
            k8s/frontend.yaml

          # Verify the resulting image references.
          grep -F \
            "image: ${API_IMAGE}:${VERSION}@${API_DIGEST}" \
            k8s/backend.yaml

          grep -F \
            "image: ${WEB_IMAGE}:${VERSION}@${WEB_DIGEST}" \
            k8s/frontend.yaml

          git diff --check

          echo "=== UPDATED BACKEND IMAGE ==="
          grep -n 'image:' k8s/backend.yaml

          echo "=== UPDATED FRONTEND IMAGE ==="
          grep -n 'image:' k8s/frontend.yaml


      - name: Validate all Kubernetes image digests
        run: |
          set -euo pipefail

          if [[ ! -f .github/scripts/verify-image-digests.sh ]]; then
            echo "ERROR: Image digest verification script is missing."
            exit 1
          fi

          bash .github/scripts/verify-image-digests.sh

      - name: Show GitOps changes
        run: |
          set -euo pipefail
          git --no-pager diff -- k8s/backend.yaml k8s/frontend.yaml

      - name: Commit and push GitOps update
        run: |
          set -euo pipefail

          if git diff --quiet -- k8s/backend.yaml k8s/frontend.yaml; then
            echo "ERROR: No Kubernetes manifest changes detected."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend.yaml k8s/frontend.yaml
          git commit -m "release: deploy ${VERSION}"

          git push origin HEAD:test-ci-workflow

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.target-branch.outputs.target_branch != 'main' }}
          make_latest: false
