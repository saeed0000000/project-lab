apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finance-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/saeed0000000/finance-devops-lab.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
