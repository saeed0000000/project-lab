apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-lab
  namespace: default
  labels:
    app: drift-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drift-lab
  template:
    metadata:
      labels:
        app: drift-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
