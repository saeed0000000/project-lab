apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-watcher
  namespace: drift-watcher
  labels:
    app.kubernetes.io/name: drift-watcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drift-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drift-watcher
    spec:
      serviceAccountName: drift-watcher
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: drift-watcher
          image: ghcr.io/saeed0000000/project-lab-drift-watcher@sha256:609f71679e18795f83cdfca741fdf44353e1748db62596650d6691c2e99bc9c9
          imagePullPolicy: IfNotPresent

          env:
            - name: DRIFT_REPO_DIR
              value: /work/repository
            - name: DRIFT_GITHUB_REPOSITORY
              value: "saeed0000000/project-lab"
            - name: DRIFT_REPO_URL
              value: "https://github.com/saeed0000000/project-lab.git"
            - name: DRIFT_DEFAULT_BRANCH
              value: "main"

            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: drift-watcher-github
                  key: GH_TOKEN

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /work
            - name: home
              mountPath: /home/watcher

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: work
          emptyDir:
            sizeLimit: 512Mi
        - name: home
          emptyDir:
            sizeLimit: 32Mi
