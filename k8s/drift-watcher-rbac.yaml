apiVersion: v1
kind: Namespace
metadata:
  name: drift-watcher
  labels:
    app.kubernetes.io/name: drift-watcher
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-watcher
  namespace: drift-watcher
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drift-watcher-read-targets
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["drift-lab"]
    verbs: ["get", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["replicas-lab"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drift-watcher-read-targets
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drift-watcher-read-targets
subjects:
  - kind: ServiceAccount
    name: drift-watcher
    namespace: drift-watcher
