apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pitr-local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-wal-archive
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: pitr-local-path-retain
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-base-backups
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: pitr-local-path-retain
  resources:
    requests:
      storage: 5Gi
