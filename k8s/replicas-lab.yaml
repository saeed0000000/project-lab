apiVersion: apps/v1
kind: Deployment
metadata:
  name: replicas-lab
  namespace: default
  labels:
    app: replicas-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replicas-lab
  template:
    metadata:
      labels:
        app: replicas-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
